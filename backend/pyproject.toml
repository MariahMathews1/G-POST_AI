[project]
name = "creo-nc-companion-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "python-multipart>=0.0.20,<1",
    "pypdf>=6,<7",
    "pypdfium2>=5,<6",
    "pillow>=12,<13",
    "pytesseract>=0.3.13,<0.4",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
